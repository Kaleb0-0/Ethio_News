# Production overrides for docker-compose.yml
# Run with: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file ./ethio-news-backend/env/.env.production up -d

services:
  backend:
    # No source code mounts in production
    volumes: []
    environment:
      DEBUG: "false"
      LOG_LEVEL: "info"
    # Remove internal port exposure
    restart: always

  frontend:
    # No source code mounts in production
    volumes: []
    environment:
      VITE_API_URL: "/api"
    restart: always

  postgres:
    # More robust restart in production
    restart: always
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8 --data-checksums"

  redis:
    restart: always
    # Persistence enabled
    command: redis-server --appendonly yes --appendfsync everysec

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./DATA/certs:/etc/nginx/certs:ro
      - ./DATA/nginx_logs:/var/log/nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
