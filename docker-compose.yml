services:
  # API Service
  backend:
    build:
      context: ./ethio-news-backend
      dockerfile: Dockerfile
    container_name: ethio_news_api
    restart: unless-stopped
    env_file:
      - ./ethio-news-backend/env/.env.development
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-net
      - db-net
      - redis-net
    volumes:
      - ./ethio-news-backend/src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./ethio-news-frontend
      dockerfile: Dockerfile
    container_name: ethio_news_web
    restart: unless-stopped
    networks:
      - app-net
    volumes:
      - ./ethio-news-frontend/src:/app/src
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database Service
  postgres:
    image: postgres:16-alpine
    container_name: ethio_news_db
    restart: unless-stopped
    env_file:
      - ./ethio-news-backend/env/.env.development
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    networks:
      - db-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DATA/db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: ethio_news_redis
    restart: unless-stopped
    networks:
      - redis-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ethio_news_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./DATA/certs:/etc/nginx/certs:ro  # Uncomment for SSL certificates
      - ./DATA/nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-net:
    driver: bridge
    name: ethio_news_app_net
  db-net:
    driver: bridge
    name: ethio_news_db_net
  redis-net:
    driver: bridge
    name: ethio_news_redis_net

volumes:
  postgres_data:
    name: ethio_news_db_data
  redis_data:
    name: ethio_news_redis_data
